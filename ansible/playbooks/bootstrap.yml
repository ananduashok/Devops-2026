---
- name: Bootstrap Debian servers
  hosts: kubernetes
  become: false

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        state: present

    - name: Add ansible user to sudo group
      ansible.builtin.user:
        name: ansible
        groups: sudo
        append: true

    - name: Allow passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: |
          ansible ALL=(ALL) NOPASSWD:ALL
        owner: root
        group: root
        mode: "0440"

    - name: Create .ssh directory
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Install authorized key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/devops2026.pub') }}"
