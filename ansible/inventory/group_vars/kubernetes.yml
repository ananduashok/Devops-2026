---
ansible_user: ansible
ansible_become: true
ansible_become_method: sudo
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/devops2026' }}"

common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - bash-completion
  - vim
  - git
  - jq

kernel_modules:
  - br_netfilter
  - overlay

sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

########################################
# Containerd
########################################

containerd_package: containerd.io

docker_repository: >-
  deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/debian
  {{ ansible_facts['distribution_release'] }} stable

docker_gpg_url: https://download.docker.com/linux/debian/gpg

########################################
# Kubernetes
########################################

kubernetes_version: "v1.34"

kubernetes_packages:
  - kubeadm
  - kubelet
  - kubectl

kubernetes_repository: >-
  deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
  https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/
  /

kubernetes_gpg_url: >-
  https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key